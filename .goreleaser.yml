version: 2

project_name: ambie

before:
  hooks:
    - go mod tidy

builds:
  - id: ambie
    main: ./cmd/ambie
    binary: ambie
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/ambie-ai/ambie-cli/internal/cli.Version={{.Version}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: ambie-ai
    name: ambie-cli
  draft: false
  prerelease: auto
  header: |
    ## AMBIE CLI {{ .Version }}

    Get an API key at https://ambie.ai/signup, then download the binary for your
    platform below or run:

    ```bash
    curl -fsSL https://raw.githubusercontent.com/ambie-ai/ambie-cli/main/install.sh | sh
    ```
